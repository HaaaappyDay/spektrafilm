name: Android
on:
  pull_request:
    paths: ['android/**', 'docs/android/**', 'docs/superpowers/plans/*android*', '.github/workflows/android.yml', 'scripts/*android*', 'tests/android/**', 'tests/test_lut_mode.py', 'src/spektrafilm/**', 'src/spektrafilm_lut_creator/**', 'pyproject.toml']
  push:
    branches: [main, 'feat/android-*']
    paths: ['android/**', 'docs/android/**', 'docs/superpowers/plans/*android*', '.github/workflows/android.yml', 'scripts/*android*', 'tests/android/**', 'tests/test_lut_mode.py', 'src/spektrafilm/**', 'src/spektrafilm_lut_creator/**', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
  device-tests:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36, 37]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          ram-size: 2048M
          heap-size: 128M
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.sourceCommit=${{ github.event.pull_request.head.sha || github.sha }} -Pandroid.testInstrumentationRunnerArguments.testedCommit=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests-api${{ matrix.api }}-${{ github.sha }}
          path: |
            android/app/build/outputs/connected_android_test_additional_output/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  python-mobile-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline reference dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test existing LUT behavior and mobile reference
        run: python -m pytest tests/android tests/lut_creator/test_cube_format.py tests/lut_creator/test_builders.py tests/test_lut_mode.py --junitxml=reports/python-mobile.xml -q
      - name: Reproduce committed reference bytes
        run: |
          python scripts/verify_android_color.py --presets android/app/src/main/assets/presets --out "$RUNNER_TEMP/mobile-reference"
          diff -rq android/app/src/androidTest/assets/render-fixtures "$RUNNER_TEMP/mobile-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-mobile-reference-${{ github.sha }}
          path: reports/python-mobile.xml
